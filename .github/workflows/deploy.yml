name: Deploy Static Programmatic SEO

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Programmatic SEO Pages
        run: node generate_seo_pages.js

      - name: Prepare Deployment Artifacts
        run: |
          # The generator outputs all 10,000+ folders inside 'dist/'
          # We need to copy the core assets into 'dist/' so the root site functions correctly.
          cp index.html dist/index.html
          cp -r videos dist/videos
          
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
